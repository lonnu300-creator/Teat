
name: Build Farnava Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sync web assets
        run: |
          rm -rf android-template/app/src/main/assets/www
          mkdir -p android-template/app/src/main/assets/www
          cp -R www/. android-template/app/src/main/assets/www/

      - name: Build Debug APK
        run: gradle -p android-template --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: farnava-debug-apk
          path: android-template/app/build/outputs/apk/debug/app-debug.apk
