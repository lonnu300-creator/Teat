
name: Build Farnava Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: farnava-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Install Android build packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Install Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Check project and synchronize HTML files
      - name: Prepare Farnava assets
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "android-template/app" ]; then
            echo "::error::android-template/app directory not found"
            exit 1
          fi

          if [ ! -f "android-template/settings.gradle" ] && \
             [ ! -f "android-template/settings.gradle.kts" ]; then
            echo "::error::Gradle settings file not found"
            exit 1
          fi

          if [ ! -f "android-template/app/build.gradle" ] && \
             [ ! -f "android-template/app/build.gradle.kts" ]; then
            echo "::error::Android app build file not found"
            exit 1
          fi

          ANDROID_ASSETS="android-template/app/src/main/assets/www"

          mkdir -p "$ANDROID_ASSETS"

          if [ -d "www" ]; then
            rm -rf "$ANDROID_ASSETS"
            mkdir -p "$ANDROID_ASSETS"
            cp -R www/. "$ANDROID_ASSETS/"
          fi

          if [ ! -f "$ANDROID_ASSETS/index.html" ]; then
            echo "::error::index.html not found in Android web assets"
            exit 1
          fi

          echo "Farnava assets verified successfully"

      # 7. Build Android APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle -p android-template \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 8. Find generated APK
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          APK=$(find android-template \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | sort | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK file was not generated"
            exit 1
          fi

          cp "$APK" artifacts/farnava-debug.apk

          echo "APK successfully prepared"
          ls -lh artifacts/farnava-debug.apk

      # 9. Upload APK
      - name: Upload Farnava APK
        uses: actions/upload-artifact@v4
        with:
          name: farnava-debug-apk
          path: artifacts/farnava-debug.apk
          if-no-files-found: error
          retention-days: 7
